<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            width: 300px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="login-card">
    <form onsubmit="validarLogin(event)">
        <div class="form-group">
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" required>
        </div>
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit">Entrar</button>
    </form>
</div>

<script>
function validarLogin(event) {
    event.preventDefault();

    var usuarioInput = document.getElementById("usuario").value.trim().toLowerCase();
    var passwordInput = document.getElementById("password").value.trim();

    var credenciales = {
        "perla": "1234",
        "quijote": "q0000"
    };

    if (credenciales[usuarioInput] && credenciales[usuarioInput] === passwordInput) {
        localStorage.setItem("usuarioActual", usuarioInput);

        // Se usa ?user= para que Firebase cargue la base de datos del usuario
        window.location.href = "pruebas.html?user=" + encodeURIComponent(usuarioInput);
    } else {
        alert("Usuario o contraseña incorrectos.");
    }
}
</script>

</body>
</html>
