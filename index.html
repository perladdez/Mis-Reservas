<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palma Access - Acceso</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            width: 320px;
        }

        .brand-title {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            color: #1a1a1a;
            font-size: 22px;
            letter-spacing: 0.5px;
        }

        /* Pestañas (Login / Registro) */
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
        }

        .tab-btn.active {
            color: #007bff;
            border-bottom: 2px solid #007bff;
            margin-bottom: -2px;
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
            font-size: 13px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-container input {
            padding-right: 35px;
        }

        button.toggle-btn {
            position: absolute;
            right: 8px;
            background: none !important;
            border: none !important;
            cursor: pointer;
            padding: 0 !important;
            width: auto !important;
            margin-top: 0 !important;
            display: flex;
            align-items: center;
        }

        .toggle-btn svg {
            width: 20px;
            height: 20px;
            fill: #666;
        }

        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2 class="brand-title">Palma Access</h2>

    <!-- Pestañas para cambiar entre Iniciar Sesión y Registrarse -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Iniciar Sesión</button>
        <button class="tab-btn" onclick="switchTab('register')">Registrarse</button>
    </div>

    <!-- Formulario Iniciar Sesión -->
    <div id="loginForm" class="form-container active">
        <form onsubmit="validarLogin(event)">
            <div class="form-group">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <div class="password-container">
                    <input type="password" id="password" required>
                    <button type="button" class="toggle-btn" onclick="togglePassword('password', this)">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit">Entrar</button>
        </form>
    </div>

    <!-- Formulario Registro -->
    <div id="registerForm" class="form-container">
        <form onsubmit="registrarUsuario(event)">
            <div class="form-group">
                <label for="regUsuario">Nuevo Usuario:</label>
                <input type="text" id="regUsuario" required>
            </div>

            <div class="form-group">
                <label for="regPassword">Contraseña:</label>
                <div class="password-container">
                    <input type="password" id="regPassword" required>
                    <button type="button" class="toggle-btn" onclick="togglePassword('regPassword', this)">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="regConfirmPassword">Confirmar Contraseña:</label>
                <div class="password-container">
                    <input type="password" id="regConfirmPassword" required>
                    <button type="button" class="toggle-btn" onclick="togglePassword('regConfirmPassword', this)">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit">Crear Cuenta</button>
        </form>
    </div>
</div>

<script>
const eyeOpenPath = "M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z";
const eyeClosedPath = "M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z";

// Obtener la base de datos de usuarios
function obtenerUsuarios() {
    var usuariosDefault = {
        "perla": "1234",
        "quijote": "q0000"
    };

    var usuariosGuardados = localStorage.getItem("usuariosPalmaAccess");
    if (usuariosGuardados) {
        return Object.assign({}, usuariosDefault, JSON.parse(usuariosGuardados));
    }
    return usuariosDefault;
}

// Iniciar sesión
function validarLogin(event) {
    event.preventDefault();

    var usuarioInput = document.getElementById("usuario").value.trim().toLowerCase();
    var passwordInput = document.getElementById("password").value.trim();

    var credenciales = obtenerUsuarios();

    if (credenciales[usuarioInput] && credenciales[usuarioInput] === passwordInput) {
        localStorage.setItem("usuarioActual", usuarioInput);
        window.location.href = "Registrodereservaciones.html?user=" + encodeURIComponent(usuarioInput);
    } else {
        alert("Usuario o contraseña incorrectos.");
    }
}

// Registrar nuevo usuario
function registrarUsuario(event) {
    event.preventDefault();

    var usuarioInput = document.getElementById("regUsuario").value.trim().toLowerCase();
    var passwordInput = document.getElementById("regPassword").value.trim();
    var confirmPasswordInput = document.getElementById("regConfirmPassword").value.trim();

    if (usuarioInput.length < 3) {
        alert("El usuario debe tener al menos 3 caracteres.");
        return;
    }

    // Validación de coincidencia de contraseñas
    if (passwordInput !== confirmPasswordInput) {
        alert("Las contraseñas no coinciden. Por favor, verifícalas.");
        return;
    }

    var credenciales = obtenerUsuarios();

    if (credenciales[usuarioInput]) {
        alert("El usuario ya existe. Intenta con otro nombre.");
        return;
    }

    // Guardar la nueva cuenta en localStorage
    var creadosPrevios = JSON.parse(localStorage.getItem("usuariosPalmaAccess") || "{}");
    creadosPrevios[usuarioInput] = passwordInput;
    localStorage.setItem("usuariosPalmaAccess", JSON.stringify(creadosPrevios));

    alert("¡Cuenta creada con éxito! Ahora puedes iniciar sesión.");
    
    // Limpiar campos y cambiar a la pestaña de Login
    document.getElementById("regUsuario").value = "";
    document.getElementById("regPassword").value = "";
    document.getElementById("regConfirmPassword").value = "";
    switchTab('login');
    document.getElementById("usuario").value = usuarioInput;
}

// Cambiar entre pestañas
function switchTab(tab) {
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const tabs = document.querySelectorAll('.tab-btn');

    if (tab === 'login') {
        loginForm.classList.add('active');
        registerForm.classList.remove('active');
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
    } else {
        registerForm.classList.add('active');
        loginForm.classList.remove('active');
        tabs[1].classList.add('active');
        tabs[0].classList.remove('active');
    }
}

// Alternar visibilidad de contraseña
function togglePassword(inputId, btn) {
    const passwordInput = document.getElementById(inputId);
    const pathElement = btn.querySelector('svg path');

    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        pathElement.setAttribute('d', eyeClosedPath);
    } else {
        passwordInput.type = 'password';
        pathElement.setAttribute('d', eyeOpenPath);
    }
}
</script>

</body>
</html>
