<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            width: 300px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Alineación del campo de contraseña y el botón del ojo */
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-container input {
            padding-right: 35px; /* Espacio para que el texto no tape el ojo */
        }

        .toggle-btn {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            width: auto;
            margin-top: 0;
            display: flex;
            align-items: center;
        }

        /* Control de tamaño para el icono SVG */
        .toggle-btn svg {
            width: 20px;
            height: 20px;
            fill: #666;
        }

        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="login-card">
    <form onsubmit="validarLogin(event)">
        <div class="form-group">
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" required>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <div class="password-container">
                <input type="password" id="password" required>
                <button type="button" class="toggle-btn" id="togglePasswordBtn" onclick="togglePassword()">
                    <svg id="eyeIcon" viewBox="0 0 24 24">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27 3.11 11 7.5c-1.73 4.39-6 7.5-11 7.5zM12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0-8a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
                    </svg>
                </button>
            </div>
        </div>

        <button type="submit">Entrar</button>
    </form>
</div>

<script>
function validarLogin(event) {
    event.preventDefault();

    var usuarioInput = document.getElementById("usuario").value.trim().toLowerCase();
    var passwordInput = document.getElementById("password").value.trim();

    var credenciales = {
        "perla": "1234",
        "quijote": "q0000"
    };

    if (credenciales[usuarioInput] && credenciales[usuarioInput] === passwordInput) {
        localStorage.setItem("usuarioActual", usuarioInput);
        window.location.href = "pruebas.html?user=" + encodeURIComponent(usuarioInput);
    } else {
        alert("Usuario o contraseña incorrectos.");
    }
}

function togglePassword() {
    const passwordInput = document.getElementById('password');
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
    } else {
        passwordInput.type = 'password';
    }
}
</script>

</body>
</html>
