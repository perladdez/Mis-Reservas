<!DOCTYPE html>
<html>
<head> <meta charset="UTF-8">
	<title> Reservas previas</title>

 <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            margin: 0;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        /* Estilos visuales de la tabla */
        table {
            border-collapse: collapse;
            width: 80%;
            max-width: 900px;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 14px 20px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 16px;
        }

        th {
            background-color: #333;
            color: white;
            font-size: 18px;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        /* Botón para regresar al menú */
        .btn-regresar {
            margin-top: 25px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .btn-regresar:hover {
            background-color: #333;
        }
    </style>
</head>
<body>

    <h1>Reservaciones Previas</h1>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Nombre del Cliente</th>
                <th>Fecha</th>
                <th>Hora</th>
                <th>Personas</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
            <!-- Ejemplo de filas estáticas -->
            <tr>
                <td>1</td>
                <td>Perla Domínguez</td>
                <td>2026-09-01</td>
                <td>20:00</td>
                <td>4</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Carlos Ruiz</td>
                <td>2026-09-02</td>
                <td>21:30</td>
                <td>2</td>
            </tr>
        </tbody>
    </table>

    <button type="button" class="btn-regresar" onclick="regresar()">Volver al menú</button>

    <script>
    function regresar() {
        window.location.href = "html2.html";
    }
    </script>

</head>
<body>
