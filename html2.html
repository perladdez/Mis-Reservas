<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reservaciones</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            gap: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <button type="button" onclick="verPrevias()">Reservas previas</button>
    <button type="button" onclick="nuevaReserva()">Nueva Reservación</button>
    <button type="button" onclick="nuevaReserva()">Pruebas</button>

<script>
  // Obtiene el usuario actual de la URL
  const params = new URLSearchParams(window.location.search);
  const usuario = params.get('user') || params.get('usuario') || localStorage.getItem('usuarioActual') || 'quijote';

  // Asigna el usuario a todos los enlaces hacia pruebas.html
  document.querySelectorAll("a[href*='pruebas.html']").forEach(link => {
      link.href = `pruebas.html?user=${encodeURIComponent(usuario)}`;
  });
</script>

</body> 
</html>
